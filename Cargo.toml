[workspace]
members = ["rust/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/brennercruvinel/anina"

[workspace.dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
crc32fast = "1.5.2"
crossterm = "0.29.0"
flate2 = "1.1.10"
include_dir = "0.7"
libc = "0.2.190"
regex = "1.13.1"
resvg = "0.48.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
subsetter = "0.2.6"
toml = "1.1.6"
ttf-parser = "0.25.1"
tui-test-rs = "=0.1.0"
unicode-width = "0.2.2"
vte = "0.15.0"

# the crates of this workspace. a path dep needs a version to be packaged.
anina-screen = { path = "rust/screen", version = "0.1.0" }
anina-runner = { path = "rust/runner", version = "0.1.0" }
anina-render = { path = "rust/render", version = "0.1.0" }
anina-record = { path = "rust/record", version = "0.1.0" }

[profile.release]
strip = true
lto = true
codegen-units = 1
