name = "burn"
description = "Burn's training dashboard (tracel-ai/burn): MNIST on the CPU, plots, the quit popup"
homepage = "https://burn.dev"
sandbox = "env"
network = true

[[requires]]
program = "cargo"
hint = "install Rust: https://rustup.rs"

[[requires]]
program = "git"
hint = "install git: https://git-scm.com"

[[vars]]
name = "BURN_DIR"
default = "${ANINA_CACHE}/burn"
about = "a tracel-ai/burn checkout; cloned and built there when missing"

[[prepare]]
about = "clone tracel-ai/burn"
run = "git clone --depth 1 https://github.com/tracel-ai/burn \"$BURN_DIR\""
creates = "${BURN_DIR}/Cargo.toml"

[[prepare]]
about = "build the mnist example on the CPU backend (about 5 min the first time)"
run = "cd \"$BURN_DIR\" && cargo build -p mnist --example mnist --release --features flex"
creates = "${BURN_DIR}/target/release/examples/mnist"

[[parts]]
name = "train"
tape = "train.tape"
title = "burn: training MNIST, live in the terminal"
about = "the dashboard fills in, plots switch, the quit popup, the training stops"
