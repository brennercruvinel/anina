name: release
on:
  push:
    tags: ["v*"]

# the token reads the repository; each job asks for what else it needs
permissions:
  contents: read

# every action is pinned by commit; the comment names the version it is.
# to move one: gh api repos/OWNER/REPO/commits/TAG --jq .sha
jobs:
  # one archive per system and processor, each built on a runner of its own
  # kind, with its checksum and an attestation of where it was built
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master, 2026-11-15
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked -p anina --target "$TARGET"
      - run: tool/tasks/release.sh pack "$GITHUB_REF_NAME" "$TARGET"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  # the release page: the four archives, their checksums, and the notes the
  # changelog holds for this version. a tag whose commit is not in main is
  # refused: a release is cut from main, where gatecheck ran
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: the tagged commit is in main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: checksums, read back
        run: |
          cd dist
          for sum in ./*.sha256; do sha256sum -c "$sum"; done
          cat ./*.sha256 >SHA256SUMS
      - name: the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tool/tasks/release.sh notes "$GITHUB_REF_NAME" >"$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.sha256 dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
