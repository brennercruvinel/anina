# run: `cargo deny check`

[graph]
all-features = true

[advisories]
yanked = "deny"
ignore = [
    # ttf-parser is unmaintained. it comes in twice: anina-render parses the
    # embedded font with it and tui-test-rs (pinned) depends on it, so swapping
    # ours for skrifa would not take it out of the tree.
    { id = "RUSTSEC-2026-0192", reason = "no maintained drop-in yet; tui-test-rs pulls it too" },
]

[licenses]
# what Cargo.lock holds today. MPL-2.0 comes in through option-ext
# (tui-test-rs > dirs). a copyleft-only crate fails on purpose.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
